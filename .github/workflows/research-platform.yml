name: Research platform checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: alpha_test
          POSTGRES_USER: alpha_test
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U alpha_test -d alpha_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: alpha-research-platform
    env:
      DATABASE_URL: postgresql+psycopg2://alpha_test:ci-only-password@localhost:5432/alpha_test
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: alpha-research-platform/requirements.txt
      - name: Install core dependencies
        run: python -m pip install -r requirements.txt
      - name: Check publication hygiene
        run: python scripts/audit_publication.py
      - name: Unit tests
        run: python scripts/ci_tests.py
      - name: Fresh database migration
        run: python -m alembic upgrade head
      - name: Disposable-schema integration tests
        run: python -m unittest discover -s tests/integration -v
      - name: Deterministic offline preview
        run: python -m alpha_platform.cli preview --count 10 --seed 42 > /tmp/alpha-preview.json
