[project]
name = "alpha-research-platform"
version = "0.1.0"
description = "Alpha research automation platform for WorldQuant BRAIN"
requires-python = ">=3.11"

dependencies = [
    # --- DB / ORM / migrations ---
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg2-binary>=2.9",

    # --- settings / validation ---
    "pydantic>=2.6",
    "pydantic-settings>=2.2",

    # --- BRAIN API client ---
    "requests>=2.31",

    # --- vector DB ---
    "qdrant-client>=1.8",

    # --- object storage ---
    "boto3>=1.34",

    # --- caching ---
    "redis>=5.0",

    # --- background workers ---
    "celery>=5.3",

    # --- data / parquet ---
    "pandas>=2.2",
    "pyarrow>=15.0",

    # --- web API for dashboard backend ---
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",

    # --- LLM ---
    "anthropic>=0.21",

    # --- experiment tracking ---
    "mlflow>=2.11",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "black>=24.0",
    "ruff>=0.3",
    "ipykernel>=6.29",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["alpha_platform*"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.black]
line-length = 110
target-version = ["py311"]