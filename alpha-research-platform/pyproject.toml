[project]
name = "alpha-research-platform"
version = "0.1.0"
description = "Alpha research automation platform for WorldQuant BRAIN"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    # --- DB / ORM / migrations ---
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg2-binary>=2.9",

    # --- settings / validation ---
    "pydantic>=2.6",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",

    # --- BRAIN API client ---
    "requests>=2.31",
    "tqdm>=4.66",
    "jinja2>=3.1",

    # --- ACE result processing ---
    "pandas>=2.2",

    # --- web API for dashboard backend ---
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "httpx>=0.27",
]

[project.optional-dependencies]
embeddings = ["qdrant-client>=1.8"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "black>=24.0",
    "ruff>=0.3",
    "ipykernel>=6.29",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["alpha_platform*"]

[tool.setuptools.package-data]
"alpha_platform.config" = ["operators_catalog.json"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.black]
line-length = 110
target-version = ["py311"]
