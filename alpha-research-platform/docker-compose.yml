services:
  postgres:
    image: postgres:16
    container_name: alpha_kb_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-alpha_kb}
      POSTGRES_USER: ${POSTGRES_USER:-alpha_kb}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-alpha_kb}"]
      interval: 5s
      timeout: 5s
      retries: 10

  qdrant:
    profiles: [experimental]
    image: qdrant/qdrant:latest
    container_name: alpha_kb_qdrant
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"   # REST
      - "127.0.0.1:6334:6334"   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage

  redis:
    profiles: [experimental]
    image: redis:7-alpine
    container_name: alpha_kb_redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data

  minio:
    profiles: [experimental]
    image: minio/minio:latest
    container_name: alpha_kb_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    ports:
      - "127.0.0.1:9000:9000"   # S3 API
      - "127.0.0.1:9001:9001"   # web console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  mlflow:
    profiles: [experimental]
    image: ghcr.io/mlflow/mlflow:latest
    container_name: alpha_kb_mlflow
    restart: unless-stopped
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri postgresql+psycopg2://${POSTGRES_USER:-alpha_kb}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-alpha_kb}
      --default-artifact-root s3://alpha-kb/mlflow-artifacts
    ports:
      - "127.0.0.1:5000:5000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  qdrant_data:
  redis_data:
  minio_data: